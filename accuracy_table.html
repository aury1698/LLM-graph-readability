<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LLM Results Table</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* --- General Page Styles --- */
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #fafbfc; color: #222; }
        h1 { text-align: center; }
        p { text-align: center; max-width: 800px; margin: 1rem auto; color: #555; }
        .controls-container { display: flex; justify-content: center; gap: 2rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 2px solid #eee; }
        .controls { text-align: center; }
        .controls h3 { margin-top: 0; color: #555; }
        .controls button { padding: 10px 20px; font-size: 1rem; margin: 0 5px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 5px; transition: background-color 0.2s, color 0.2s; }
        .mode-controls button.active { background: #e8711a; color: white; border-color: #e8711a; }
        .mode-controls button:not(.active) { background: #80868b; color: white; border-color: #80868b; }

        /* --- Filter Styles --- */
        .filters-container { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 0.8rem; color: #555; margin-bottom: 0.25rem; font-weight: bold; }
        .filter-group select { padding: 8px; font-size: 0.9rem; border: 1px solid #ccc; border-radius: 4px; background: #fff; }

        /* --- Table Styles --- */
        #table-container { max-width: 1600px; margin: 2rem auto; padding: 1.5rem; border: 1px solid #eee; border-radius: 8px; background: #fff; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { border: 1px solid #ddd; padding: 10px 12px; text-align: left; white-space: nowrap; }
        thead { background-color: #f8f9fa; }
        th { font-weight: 600; position: sticky; top: 0; background: #f1f3f4; }
        tbody tr:nth-child(even) { background-color: #f8f9fa; }
        tbody tr:hover { background-color: #e9ecef; }
        #message-area { text-align: center; font-size: 1.2rem; color: #777; padding: 2rem; }
    </style>
</head>
<body>
    <h1>LLM Results - Detailed Accuracy Table</h1>
    <p>This page displays the detailed accuracy results, grouped by model, configuration, task, layout, and difficulty (ground truth).</p>

    <div class="controls-container">
        <div class="controls mode-controls">
            <h3>Select Dataset</h3>
            <button id="btn-Exp1">Exp1</button>
            <button id="btn-Exp2">Exp2</button>
        </div>
    </div>
    
    <div class="filters-container" id="filters">
        <div class="filter-group">
            <label for="filter-model">Model</label>
            <select id="filter-model"></select>
        </div>
        <div class="filter-group">
            <label for="filter-llm-mode">LLM Mode</label>
            <select id="filter-llm-mode"></select>
        </div>
        <div class="filter-group">
            <label for="filter-cot-mode">COT Mode</label>
            <select id="filter-cot-mode"></select>
        </div>
        <div class="filter-group">
            <label for="filter-task">Task</label>
            <select id="filter-task"></select>
        </div>
        <div class="filter-group">
            <label for="filter-gt">Ground Truth</label>
            <select id="filter-gt"></select>
        </div>
    </div>

    <div id="table-container">
        <div id="message-area">Select a dataset to view the results...</div>
        <table id="results-table"></table>
    </div>

<script>

// ===================================================================================
// SCRIPT TO LOAD CSV, BUILD FILTERS, AND RENDER THE TABLE
// ===================================================================================

let currentMode = '';
let fullData = []; // Store the complete dataset here

const filterSelectors = {
    model: document.getElementById('filter-model'),
    llmMode: document.getElementById('filter-llm-mode'),
    cotMode: document.getElementById('filter-cot-mode'),
    task: document.getElementById('filter-task'),
    gt: document.getElementById('filter-gt')
};

// --- Main function to load data and initialize the view ---
async function loadAndInitialize(mode) {
    currentMode = mode;
    document.getElementById('btn-Exp2').classList.toggle('active', currentMode === 'exp2');
    document.getElementById('btn-Exp1').classList.toggle('active', currentMode === 'exp1');
    
    const messageArea = document.getElementById('message-area');
    messageArea.style.display = 'block';
    messageArea.textContent = `Loading results for ${currentMode}...`;
    document.getElementById('results-table').innerHTML = '';

    const filePath = `average_accuracies_${currentMode}_by_difficulty.csv`;

    try {
        fullData = await d3.csv(filePath);
        if (fullData.length === 0) {
            messageArea.textContent = `No data found in ${filePath}.`;
            return;
        }
        populateFilters();
        applyFilters();
    } catch (error) {
        console.error("Error loading CSV:", error);
        messageArea.textContent = `Error: Could not load '${filePath}'. Make sure it exists.`;
    }
}

// --- Populate filter dropdowns with unique values from the data ---
function populateFilters() {
    // Column names in the CSV and their corresponding select element
    const filterMapping = {
        'Model Name': filterSelectors.model,
        'LLM Mode': filterSelectors.llmMode,
        'COT Mode': filterSelectors.cotMode,
        'Task_Group': filterSelectors.task,
        'Ground_Truth': filterSelectors.gt
    };

    for (const [columnName, selector] of Object.entries(filterMapping)) {
        const uniqueValues = [...new Set(fullData.map(d => d[columnName]))].sort();
        
        selector.innerHTML = '<option value="all">All</option>'; // Reset and add 'All' option
        uniqueValues.forEach(value => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            selector.appendChild(option);
        });
        // Add event listener to re-filter when a selection changes
        selector.onchange = applyFilters;
    }
}

// --- Filter the data based on selections and render the table ---
function applyFilters() {
    const filters = {
        'Model Name': filterSelectors.model.value,
        'LLM Mode': filterSelectors.llmMode.value,
        'COT Mode': filterSelectors.cotMode.value,
        'Task_Group': filterSelectors.task.value,
        'Ground_Truth': filterSelectors.gt.value
    };

    let filteredData = fullData.filter(row => {
        for (const [column, value] of Object.entries(filters)) {
            if (value !== 'all' && row[column] !== value) {
                return false;
            }
        }
        return true;
    });

    renderTable(filteredData);
}

// --- Renders the HTML table with the provided data ---
function renderTable(data) {
    const table = document.getElementById('results-table');
    const messageArea = document.getElementById('message-area');
    table.innerHTML = ''; // Clear previous results

    if (data.length === 0) {
        messageArea.style.display = 'block';
        messageArea.textContent = 'No results match the current filters.';
        return;
    }
    
    messageArea.style.display = 'none';

    // 1. Table header
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    const headers = Object.keys(data[0]);
    headers.forEach(headerText => {
        const th = document.createElement('th');
        th.textContent = headerText;
        headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    // 2. Table body
    const tbody = document.createElement('tbody');
    data.forEach(rowData => {
        const row = document.createElement('tr');
        headers.forEach(header => {
            const td = document.createElement('td');
            if (header.toLowerCase() === 'accuracy') {
                td.textContent = parseFloat(rowData[header]).toFixed(2);
            } else {
                td.textContent = rowData[header];
            }
            row.appendChild(td);
        });
        tbody.appendChild(row);
    });
    table.appendChild(tbody);
}

// --- Initial Event Listeners ---
document.getElementById('btn-Exp2').addEventListener('click', () => loadAndInitialize('exp2'));
document.getElementById('btn-Exp1').addEventListener('click', () => loadAndInitialize('exp1'));

</script>
</body>
</html>
