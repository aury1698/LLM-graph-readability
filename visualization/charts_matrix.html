<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Results Dashboard</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* --- General Page Styles --- */
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
            background: #fafbfc;
            color: #222;
        }

        h1,
        h2 {
            text-align: center;
        }

        p {
            text-align: center;
            max-width: 800px;
            margin: 1rem auto;
            color: #555;
        }

        a {
            color: #1a73e8;
        }

        .controls-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #eee;
        }

        .controls {
            text-align: center;
        }

        .controls h3 {
            margin-top: 0;
            color: #555;
        }

        .controls button {
            padding: 10px 20px;
            font-size: 1rem;
            margin: 0 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 5px;
            transition: background-color 0.2s, color 0.2s;
        }

        .mode-controls button.active {
            background: #e8711a;
            color: white;
            border-color: #e8711a;
        }

        .mode-controls button:not(.active) {
            background: #80868b;
            color: white;
            border-color: #80868b;
        }

        /* --- Chart Specific Styles --- */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr;
            /* Single column layout */
            gap: 2rem;
        }

        .chart-wrapper {
            max-width: 1800px;
            margin: 1rem auto;
            padding: 1.5rem;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fff;
        }

        .chart-title {
            text-align: center;
            margin-top: 0;
            margin-bottom: 2rem;
            color: #333;
        }

        .axis-label {
            font-size: 0.8rem;
            fill: #555;
        }

        .tick text {
            font-size: 0.75rem;
        }

        .legend {
            font-size: 0.8rem;
        }

        /* --- Tooltip Style --- */
        .tooltip {
            position: absolute;
            visibility: hidden;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            pointer-events: none;
        }

        /* Specific style for beeswarm points */
        .beeswarm-point {
            stroke: #333;
            stroke-width: 0.5px;
        }

        .mean-line {
            stroke: red;
            stroke-width: 2px;
            stroke-dasharray: 4;
        }
    </style>
</head>

<body>
    <h1>LLM Results Dashboard</h1>
    <p>
        This dashboard provides a high-level summary of model performance.
        For a detailed, instance-by-instance view, see the <a href="visualization.html">main visualization page</a>.
    </p>

    <div class="controls-container">
        <div class="controls mode-controls">
            <h3>Select Dataset</h3>
            <button id="btn-aurora">Aurora</button>
            <button id="btn-bastian">Bastian</button>
        </div>
    </div>

    <!-- Container where charts will be rendered -->
    <div id="charts-container" class="chart-grid">
        <!-- Charts will be dynamically added here -->
    </div>

    <div id="tooltip" class="tooltip"></div>

</body>
<script>

    // ===================================================================================
    // SCRIPT FOR CHARTS VISUALIZATION 
    // ===================================================================================

    let currentMode = 'aurora';

    // --- DATA LOADING ---
    async function loadAndAggregateResults(basePath, mode) {
        let allFilePaths = [];
        const modelsToLoad = ["gemini-2.5-flash", "mistral-small-3.1-24b", "gpt-5"];
        for (const modelName of modelsToLoad) {
            const shotTypes = ["zero_shot", "few_shot"];
            const cotTypes = ["cot", "no_cot"];
            const MAX_ATTEMPTS_TO_CHECK = 20;
            for (const shot of shotTypes) {
                for (const cot of cotTypes) {
                    for (let attempt = 1; attempt <= MAX_ATTEMPTS_TO_CHECK; attempt++) {
                        const fileName = `results_attempt_${attempt}.csv`;
                        const basePathForModel = (mode === 'bastian') ? '../aesthetic_effect_human_performance' : '../layout_algorithms_performance';
                        const filePath = `${basePathForModel}/results/${modelName}/${shot}/${cot}/${fileName}`;
                        allFilePaths.push(filePath);
                    }
                }
            }
        }
        const promises = allFilePaths.map(path => d3.csv(path).catch(error => []));
        const resultsFromAllFiles = await Promise.all(promises);
        return resultsFromAllFiles.flat();
    }

    function processDataForMatrix(rawData) {
        const tasks = ['task1', 'task2', 'task3'];
        const layouts = Array.from(new Set(rawData.map(d => (d.Layout || '').split('_')[0]))).filter(Boolean).sort();
        const models = Array.from(new Set(rawData.map(d => d["Model Name"]))).sort();

        const cells = {};
        for (const t of tasks) {
            cells[t] = {};
            for (const l of layouts) {
                cells[t][l] = {};
                for (const m of models) cells[t][l][m] = [];
            }
        }

        const splitLayout = d => (d.Layout || '').split('_').slice(0, 3).join('_'); // e.g., 'FD-FR_task1_gt2'
        const grouped = d3.group(rawData, d => splitLayout(d), d => d["Model Name"]);

        for (const [testId, modelMap] of grouped) {
            const parts = testId.split('_');
            const layout = parts[0];
            const taskToken = parts.slice(1).find(p => p.toLowerCase().startsWith('task')) || parts.slice(1).join('_');
            const task = (taskToken || '').toLowerCase();

            // skip unknown tasks/layouts
            if (!cells[task] || !cells[task][layout]) continue;

            for (const modelLabel of models) {
                const results = modelMap.get(modelLabel) || [];
                if (results.length === 0) continue;

                // group results by the triple: LLM Mode x COT Mode x gtN
                const tripleGroups = d3.group(results, r => {
                    const llm = (r["LLM Mode"] || '').trim();
                    const cot = (r["COT Mode"] || '').trim();
                    const m = (r.Layout || '').match(/_gt(\d+)/i);
                    const gt = m ? `gt${m[1]}` : 'gt_unknown';
                    return `${llm}||${cot}||${gt}`;
                });

                // compute average
                for (const [key, arr] of tripleGroups) {
                    if (arr.length === 0) continue;
                    const [llmMode, cotMode, gtToken] = key.split('||');
                    const correct = arr.filter(r => r["Correct Prediction (True/False)"] === 'True').length;
                    const accuracy = (arr.length > 0) ? (correct / arr.length) * 100 : 0;
                    const point = {
                        test: testId,
                        llmMode,
                        cotMode,
                        accuracy,
                        count: arr.length,
                        rawModelName: arr[0]["Model Name"],
                        gt: gtToken
                    };
                    cells[task][layout][modelLabel].push(point);
                }
            }
        }
        return { tasks, layouts, models, cells };
    }


    // --- D3.JS CHART DRAWING FUNCTIONS ---

    const tooltip = d3.select("#tooltip");

    function drawBeeswarmMatrix(containerId, cellData) {
        d3.select(containerId).select("svg").remove();

        const margin = { top: 40, right: 30, bottom: 60, left: 60 };
        const width = 1600 - margin.left - margin.right;
        const height = 500 - margin.top - margin.bottom;

        const svg = d3.select(containerId).append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g").attr("transform", `translate(${margin.left},${margin.top})`);

        // build matrix data
        const { tasks, layouts, models, cells } = cellData;

        const colorPicker = d => {
            // Cot is darker, No-Cot lighter
            // In order: Zero-Shot No-Cot, Zero-Shot Cot, Few-Shot No-Cot, Few-Shot Cot
            const colorOpenAI = ["#61bcf9", "#0c2bc9", "#e8b5fc", "#9d0cd6"];
            const colorMistral = ["#f3f99a", "#fce307", "#fca73f", "#fc742a"];
            const colorGemini = ["#f785cd", "#e21478", "#ed5a5a", "#e00808"]

            let i = 0;
            i = d.cotMode === "COT" ? i + 1 : i;
            i = d.llmMode === "Few-Shot" ? i + 2 : i;

            switch (d.rawModelName) {
                case "gpt-5":
                case "gpt-5-2025-08-07":
                    return colorOpenAI[i];
                case "mistral-small-3.1-24b":
                    return colorMistral[i];
                case "gemini-2.5-flash":
                    return colorGemini[i];
            }
        }

        // layout settings for the matrix
        const cols = layouts.length;
        const rows = tasks.length;
        const cellPadding = 8;
        const cellInnerPadding = 6;

        const cellWidth = width / Math.max(1, cols);
        const cellHeight = height / Math.max(1, rows);

        // Top column labels (layouts)
        svg.selectAll(".col-label").data(layouts).join("text")
            .attr("class", "col-label")
            .attr("x", (_, i) => i * cellWidth + cellWidth / 2)
            .attr("y", -10)
            .attr("text-anchor", "middle")
            .style("font-weight", "600")
            .style("fill", "#444")
            .text(d => d);

        // Left row labels (tasks)
        svg.selectAll(".row-label").data(tasks).join("text")
            .attr("class", "row-label")
            .attr("x", -10)
            .attr("y", (_, i) => i * cellHeight + cellHeight / 2)
            .attr("text-anchor", "end")
            .attr("dominant-baseline", "middle")
            .style("font-weight", "600")
            .style("fill", "#444")
            .text(d => d);

        // Create a group for each cell
        const cellGroup = svg.selectAll(".matrix-cell")
            .data(
                tasks.flatMap((t, r) => layouts.map((l, c) => ({ task: t, layout: l, r, c })))
            )
            .join("g")
            .attr("class", "matrix-cell")
            .attr("transform", d => `translate(${d.c * cellWidth}, ${d.r * cellHeight})`);

        // draw cell backgrounds / borders
        cellGroup.append("rect")
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", cellWidth)
            .attr("height", cellHeight)
            .attr("fill", "transparent")

        // For each cell, plot beeswarms for all models
        cellGroup.each(function (cellInfo) {
            const g = d3.select(this);

            // inner plotting area
            const innerX = cellPadding;
            const innerY = cellPadding;
            const innerW = cellWidth - cellPadding * 2;
            const innerH = cellHeight - cellPadding * 2;

            // y-scale maps accuracy to vertical position within the cell (same 0-100% for every cell)
            const yScale = d3.scaleLinear().domain([0, 100]).range([innerH - cellInnerPadding, cellInnerPadding]);

            // Hide the default left axis (it is created later) so it doesn't consume horizontal space
            if (!document.getElementById('hide-cell-y-axis-style')) {
                d3.select("head").append("style")
                    .attr("id", "hide-cell-y-axis-style")
                    .text(".cell-y-axis { display: none !important; }");
            }


            // Model slot x positions inside the cell (shift right a bit so axis doesn't overlap)
            const slotX = i => innerX + (i + 0.5) * (innerW / models.length) + 6;

            // Collect points for this cell from cells[task][layout][model]
            const pts = [];
            models.forEach((m, mi) => {
                const arr = (cells[cellInfo.task] && cells[cellInfo.task][cellInfo.layout] && cells[cellInfo.task][cellInfo.layout][m]) || [];
                arr.forEach(d => {
                    pts.push(Object.assign({}, d, {
                        modelKey: m,
                        modelIndex: mi,
                        // initial anchor target for simulation
                        targetX: slotX(mi),
                        // initial approximate y (add innerY because axis transform moved origin)
                        targetY: innerY + yScale(d.accuracy),
                        r: 3.5
                    }));
                });
            });

            if (pts.length === 0) {
                // small hint when no points
                g.append("text")
                    .attr("x", innerX + innerW / 2)
                    .attr("y", innerY + innerH / 2)
                    .attr("text-anchor", "middle")
                    .attr("dominant-baseline", "middle")
                    .attr("fill", "#999")
                    .style("font-size", "10px")
                    .text("no data");
                return;
            }

            // run a local force simulation to avoid overlap, grouping points around each model slot
            const sim = d3.forceSimulation(pts)
                .force("x", d3.forceX(d => d.targetX).strength(1))
                .force("y", d3.forceY(d => d.targetY).strength(1))
                .force("collide", d3.forceCollide(d => d.r + 0.5))
                .stop();

            for (let i = 0; i < 80; ++i) sim.tick();

            // draw mean lines per model within this cell
            const means = d3.rollup(pts, v => d3.mean(v, d => d.accuracy), d => d.modelKey);
            const meanGroup = g.append("g").attr("class", "means");
            Array.from(means.entries()).forEach(([m, meanVal]) => {

                const mi = models.indexOf(m);
                const xCenter = slotX(mi);
                const yPos = innerY + yScale(meanVal);
                const lineW = Math.min(innerW / models.length * 0.7, 40);
                meanGroup.append("line")
                    .attr("x1", xCenter - lineW / 2)
                    .attr("x2", xCenter + lineW / 2)
                    .attr("y1", yPos)
                    .attr("y2", yPos)
                    .attr("stroke", "#ccc")
                    .attr("stroke-width", 2)
                    .attr("stroke-dasharray", "4 2")
                    .attr("opacity", 0.9);
            });

            // draw points
            const points = g.append("g").attr("class", "points")
                .selectAll("circle")
                .data(pts)
                .join("circle")
                .attr("cx", d => d.x)
                .attr("cy", d => d.y)
                .attr("r", d => d.r)
                .attr("fill", d => colorPicker(d))
                .on("mouseover", () => tooltip.style("visibility", "visible"))
                .on("mousemove", (event, d) => {
                    tooltip.html(
                        `<b>${d.rawModelName}</b><br>${d.llmMode} / ${d.cotMode}<br>Accuracy: ${d.accuracy.toFixed(1)}%<br>Count: ${d.count}<br>${d.test}`
                    )
                        .style("top", (event.pageY - 10) + "px")
                        .style("left", (event.pageX + 10) + "px");
                })
                .on("mouseout", () => tooltip.style("visibility", "hidden"));

            // Add model labels only in the very last row of the matrix
            if (cellInfo.r === tasks.length - 1) {
                const labelGroup = g.append("g").attr("class", "cell-model-labels");
                models.forEach((m, mi) => {
                    labelGroup.append("text")
                        .attr("x", slotX(mi))
                        .attr("y", innerY + innerH + 20)
                        .attr("text-anchor", "middle")
                        .attr("dominant-baseline", "alphabetic")
                        .style("font-size", "11px")
                        .style("fill", "#444")
                        .text(m.replace(/.*?(gemini|mistral|Gemini|Mistral|gpt-5).*/i, (s) => {
                            // shorten common model labels if possible
                            if (/mistral/i.test(s)) return "Mistral";
                            if (/gemini/i.test(s)) return "Gemini";
                            if (/gpt-5/i.test(s)) return "gpt-5";
                            return s;
                        }));
                });
            }

        });

    }


    async function renderDashboard() {
        document.getElementById('charts-container').innerHTML = '<h2>Loading and processing results...</h2>';

        document.getElementById('btn-aurora').classList.toggle('active', currentMode === 'aurora');
        document.getElementById('btn-bastian').classList.toggle('active', currentMode === 'bastian');

        //Load human results 
        let human_results_bastian = { "errors": { "b-": 0.53, "b+": 0.24, "c-": 0.80, "c+": 0.29, "m-": 0.38, "m+": 0.36, "o-": 0.36, "o+": 0.36, "s-": 0.31, "s+": 0.29 } };
        let human_results_aurora = { "errors": { "FD-FR": 0.164, "FD-K": 0.109, "PG": 0.291, "PGS": 0.236, "POGBa": 0.236, "POGBb": 0.255, "SEIS": 0.436, "Tu": 0.145 } };
        let human_results = (currentMode === 'bastian') ? human_results_bastian : human_results_aurora;
        let path = (currentMode === 'bastian') ? '../aesthetic_effect_human_performance' : '../layout_algorithms_performance';

        const rawData = await loadAndAggregateResults(path, currentMode);

        if (rawData.length === 0) {
            document.getElementById('charts-container').innerHTML = `<h1>No result files found for the ${currentMode} dataset.</h1>`;
            return;
        }


        const matrixData = processDataForMatrix(rawData);

        // Render the page structure with containers for all charts
        document.getElementById('charts-container').innerHTML = `
        <div class="chart-wrapper">
            <h2 class="chart-title">Matrix</h2>
            <div id="beeswarm-matrix"></div>
        </div>
    `;

        // Draw each all charts
        drawBeeswarmMatrix("#beeswarm-matrix", matrixData);
    }

    // --- Event Listeners ---
    document.getElementById('btn-aurora').addEventListener('click', () => { currentMode = 'aurora'; renderDashboard(); });
    document.getElementById('btn-bastian').addEventListener('click', () => { currentMode = 'bastian'; renderDashboard(); });

    // Initial load
    renderDashboard();

</script>

</html>
