<script>

// ===================================================================================
// SCRIPT FOR CHARTS VISUALIZATION 
// ===================================================================================

let currentMode = 'aurora';
let layoutOrder = 'alphabetical'; // or 'avg_accuracy'


function getGlobalColor(modelName, llmMode, cotMode) {
    const name = modelName.toLowerCase();
    const llm = (llmMode || '').toLowerCase();
    const cot = (cotMode || '').toLowerCase();

    // New: color scheme definition based on model and shot/cot
    // No-Cot is lighter, Cot is darker, 
    // In order: Zero-Shot No-Cot, Zero-Shot Cot, Few-Shot No-Cot, Few-Shot Cot
    const colorOpenAI = ["#b2dde6", "#90e0ef", "#00b4d8", "#0077b6", "#090ca0"];
    const colorMistral = ["#ffd700", "#ffaf01", "#ff8204", "#fa500f", "#e00500"];
    const colorGemini = ["#fb8cad", "#e75c9d", "#c80d9b", "#bf1a3b", "#910824"]
    const colorGLM = ["#91f79f", "#53efb6", "#37c18e", "#118e60", "#056355"];
    const colorHuman = "#888888"; // Dark grey color for humans to differentiate from models
    const colorDefault = "#cccccc";


    let i = 0;
    if (cot === 'cot') i += 1;
    if (llm.includes('few')) i += 2;

    if (name.includes('gpt-5')) return colorOpenAI[i];
    if (name.includes('mistral')) return colorMistral[i];
    if (name.includes('gemini')) return colorGemini[i];
    if (name.includes('glm')) return colorGLM[i];
    if (name.includes('human')) return colorHuman;
    
    return colorDefault; // Fallback for any unknown model
}

// --- DATA LOADING ---
async function loadAndAggregateResults(basePath, mode) {
    let allFilePaths = [];
    const modelsToLoad = ["gemini-2.5-flash", "mistral-small-3.1-24b", "gpt-5", "glm-4.5v-106b"];
    for (const modelName of modelsToLoad) {
        const shotTypes = ["zero_shot", "few_shot"];
        const cotTypes = ["cot", "no_cot"];
        const MAX_ATTEMPTS_TO_CHECK = 20;
        for (const shot of shotTypes) {
            for (const cot of cotTypes) {
                for (let attempt = 1; attempt <= MAX_ATTEMPTS_TO_CHECK; attempt++) {
                    const fileName = `results_attempt_${attempt}.csv`;
                    // Note: Path depends on the final file structure. Using current structure:
                    let basePathForModel = (mode === 'bastian') ? '../aesthetic_effect_human_performance' : '../layout_algorithms_performance';
                    const filePath = `${basePathForModel}/results/${modelName}/${shot}/${cot}/${fileName}`;
                    allFilePaths.push(filePath);
                }
            }
        }
    }
    const promises = allFilePaths.map(path => d3.csv(path).catch(error => []));
    const resultsFromAllFiles = await Promise.all(promises);
    return resultsFromAllFiles.flat();
}

// --- DATA PROCESSING FUNCTIONS ---

// 1. Process data for the OVERALL ACCURACY chart
function processDataForOverallChart(rawData, humanResults) {
    const groupedData = d3.group(rawData, d => d["Model Name"], d => d["LLM Mode"], d => d["COT Mode"]);
    const summary = [];
    for (const [modelName, modelData] of groupedData) {
        for (const [llmMode, llmModeData] of modelData) {
            for (const [cotMode, results] of llmModeData) {
                if (results.length === 0) continue;
                const correct = results.filter(d => d["Correct Prediction (True/False)"] === 'True').length;
                const accuracy = (results.length > 0) ? (correct / results.length) * 100 : 0;
                
                let displayModelName;
                if (modelName.includes('mistral')) {
                    displayModelName = 'Mistral';
                } else if (modelName.includes('gemini')) {
                    displayModelName = 'Gemini';
                } else if (modelName.includes('gpt-5')) {
                    displayModelName = 'GPT-5';
                } else if (modelName.includes('glm')) {
                    displayModelName = 'GLM4.5';
                } else {
                    displayModelName = modelName;
                }

                summary.push({
                    model: displayModelName,
                    category: `${llmMode} (${cotMode})`,
                    accuracy: accuracy
                });
            }
        }
    }
    const humanAccuracy = (1 - d3.mean(Object.values(humanResults.errors))) * 100;
    summary.push({ model: 'Human', category: 'Performance', accuracy: humanAccuracy });
    return summary;
}

// 2. Process data for the ACCURACY BY TASK chart
function processDataForTaskChart(rawData) {
    // Group by Task (task1, task2, etc.) and then by configuration
    const groupedData = d3.group(rawData, 
        d => d.Task.split('_')[0], // Extracts 'task1', 'task2', etc.
        d => `${d["Model Name"].includes('mistral') ? 'Mistral' : d["Model Name"].includes('gpt-5') ? 'GPT-5' : d["Model Name"].includes('glm') ? 'GLM4.5' : 'Gemini'} ${d["LLM Mode"]} (${d["COT Mode"]})`
    );
    
    const summary = [];
    const categories = new Set(); // To keep track of all unique configurations
    
    for (const [task, taskData] of groupedData) {
        const taskSummary = { task: task };
        for (const [config, results] of taskData) {
            if (results.length === 0) continue;
            const correct = results.filter(d => d["Correct Prediction (True/False)"] === 'True').length;
            const accuracy = (results.length > 0) ? (correct / results.length) * 100 : 0;
            taskSummary[config] = accuracy;
            categories.add(config);
        }
        summary.push(taskSummary);
    }
    return { data: summary, categories: Array.from(categories) };
}

// 3. Process data for the ACCURACY BY LAYOUT chart
function processDataForLayoutChart(rawData) {
    // Group by Layout Type (FD-FR, PG, etc.)
    const groupedData = d3.group(rawData, 
        d => d.Layout.split('_')[0], // Extracts 'FD-FR', 'PG', etc.
        d => `${d["Model Name"].includes('mistral') ? 'Mistral' : d["Model Name"].includes('gpt-5') ? 'GPT-5' : d["Model Name"].includes('glm') ? 'GLM4.5' : 'Gemini'} ${d["LLM Mode"]} (${d["COT Mode"]})`
    );

    const summary = [];
    const categories = new Set();
    
    for (const [layout, layoutData] of groupedData) {
        const layoutSummary = { layout: layout };
        for (const [config, results] of layoutData) {
             if (results.length === 0) continue;
            const correct = results.filter(d => d["Correct Prediction (True/False)"] === 'True').length;
            const accuracy = (results.length > 0) ? (correct / results.length) * 100 : 0;
            layoutSummary[config] = accuracy;
            categories.add(config);
        }
        summary.push(layoutSummary);
    }
    return { data: summary, categories: Array.from(categories).sort() };
}


// NEW: Process data for layout charts, but separated by model
function processDataForLayoutChartByModel(rawData) {
    const modelsData = {}; // { 'GPT-5': { data: [], categories: [] }, 'Mistral': ... }

    // First, group all raw data by a simplified model name
    const getModelName = (d) => {
        const modelName = d["Model Name"];
        if (modelName.includes('mistral')) return 'Mistral';
        if (modelName.includes('gemini')) return 'Gemini';
        if (modelName.includes('gpt-5')) return 'GPT-5';
        if (modelName.includes('glm')) return 'GLM4.5';
        return modelName; // fallback
    };
    
    const groupedByModel = d3.group(rawData, getModelName);

    // Now, process each model's data individually
    for (const [modelName, modelRawData] of groupedByModel) {
        // Group by Layout Type and then by configuration
        const groupedData = d3.group(modelRawData,
            d => d.Layout.split('_')[0], // 'FD-FR', 'PG', etc.
            d => `${d["LLM Mode"]} (${d["COT Mode"]})` // 'zero_shot (cot)', etc.
        );

        const summary = [];
        const categories = new Set();

        for (const [layout, layoutData] of groupedData) {
            const layoutSummary = { layout: layout };
            for (const [config, results] of layoutData) {
                if (results.length === 0) continue;
                const correct = results.filter(d => d["Correct Prediction (True/False)"] === 'True').length;
                const accuracy = (results.length > 0) ? (correct / results.length) * 100 : 0;
                layoutSummary[config] = accuracy;
                categories.add(config);
            }
            summary.push(layoutSummary);
        }

        modelsData[modelName] = {
            data: summary,
            categories: Array.from(categories).sort()
        };
    }
    return modelsData;
}


// 3.5 Re-order layout categories for "bastian mode" (i.e. "m+" next to "m-")
function reorderLayoutData(layoutSummary) {
    const data = layoutSummary.data || [];
    // Map baseName -> items
    const baseMap = new Map();
    const baseOrder = [];
    data.forEach(item => {
        const name = item.layout;
        const m = name.match(/^(.+?)([+\-])?$/);
        const base = m ? m[1] : name;
        if (!baseMap.has(base)) {
            baseMap.set(base, []);
            baseOrder.push(base);
        }
        baseMap.get(base).push(item);
    });

    const ordered = [];
    baseOrder.forEach(base => {
        const entries = baseMap.get(base);
        // Prefer to add '-' then '+' (so pair appears adjacent). If only one exists, keep it.
        const minus = entries.find(e => /-$/.test(e.layout));
        const plus = entries.find(e => /\+$/.test(e.layout));
        
        if (plus) ordered.push(plus);
        if (minus) ordered.push(minus);
        // Add any other variants (no +/-) afterwards
        entries.forEach(e => {
            if (!/\+$/.test(e.layout) && !/-$/.test(e.layout)) ordered.push(e);
        });
    });

    return { data: ordered, categories: layoutSummary.categories };
}

// 4. Process data for the ACCURACY MATRIX chart
function processDataForMatrix(rawData) {
    const tasks = ['task1', 'task2', 'task3'];
    // Remove .sort() here. The sorting is now handled dynamically in drawBeeswarmMatrix.
    const layouts = Array.from(new Set(rawData.map(d => (d.Layout || '').split('_')[0]))).filter(Boolean);
    const models = Array.from(new Set(rawData.map(d => d["Model Name"]))).sort();

    const cells = {};
    for (const t of tasks) {
        cells[t] = {};
        for (const l of layouts) {
            cells[t][l] = {};
            for (const m of models) cells[t][l][m] = [];
        }
    }

    const splitLayout = d => (d.Layout || '').split('_').slice(0, 3).join('_'); // e.g., 'FD-FR_task1_gt2'
    const grouped = d3.group(rawData, d => splitLayout(d), d => d["Model Name"]);

    for (const [testId, modelMap] of grouped) {
        const parts = testId.split('_');
        const layout = parts[0];
        const taskToken = parts.slice(1).find(p => p.toLowerCase().startsWith('task')) || parts.slice(1).join('_');
        const task = (taskToken || '').toLowerCase();

        // skip unknown tasks/layouts
        if (!cells[task] || !cells[task][layout]) continue;

        for (const modelLabel of models) {
            const results = modelMap.get(modelLabel) || [];
            if (results.length === 0) continue;

            // group results by the triple: LLM Mode x COT Mode x gtN
            const tripleGroups = d3.group(results, r => {
                const llm = (r["LLM Mode"] || '').trim();
                const cot = (r["COT Mode"] || '').trim();
                const m = (r.Layout || '').match(/_gt(\d+)/i);
                const gt = m ? `gt${m[1]}` : 'gt_unknown';
                return `${llm}||${cot}||${gt}`;
            });

            // compute average
            for (const [key, arr] of tripleGroups) {
                if (arr.length === 0) continue;
                const [llmMode, cotMode, gtToken] = key.split('||');
                const correct = arr.filter(r => r["Correct Prediction (True/False)"] === 'True').length;
                const accuracy = (arr.length > 0) ? (correct / arr.length) * 100 : 0;
                const point = {
                    test: testId,
                    llmMode,
                    cotMode,
                    accuracy,
                    count: arr.length,
                    rawModelName: arr[0]["Model Name"],
                    gt: gtToken
                };
                cells[task][layout][modelLabel].push(point);
            }
        }
    }
    return { tasks, layouts, models, cells };
}


// 5. Process data for ACCURACY BY LAYOUT (Aggregated by Model Family)
function processDataForLayoutChartByModelFamily(rawData) {
    
    // Helper function to get simplified model name
    const getModelName = (d) => {
        const modelName = d["Model Name"];
        if (modelName.includes('mistral')) return 'Mistral';
        if (modelName.includes('gemini')) return 'Gemini';
        if (modelName.includes('gpt-5')) return 'GPT-5';
        if (modelName.includes('glm')) return 'GLM4.5';
        return modelName; // fallback
    };

    // Group by Layout Type (FD-FR, PG, etc.) and then by Model Family
    const groupedData = d3.group(rawData, 
        d => d.Layout.split('_')[0], // Extracts 'FD-FR', 'PG', etc.
        d => getModelName(d) // Extracts 'Mistral', 'GPT-5', etc.
    );

    const summary = [];
    const categories = new Set(); // To keep track of all unique model families
    
    for (const [layout, layoutData] of groupedData) {
        const layoutSummary = { layout: layout };
        
        for (const [modelFamily, results] of layoutData) {
            // 'results' now contains ALL configs for that model (zero, few, cot, no_cot)
            if (results.length === 0) continue;
            
            const correct = results.filter(d => d["Correct Prediction (True/False)"] === 'True').length;
            // The accuracy is the average over all configurations for this model family
            const accuracy = (results.length > 0) ? (correct / results.length) * 100 : 0;
            
            layoutSummary[modelFamily] = accuracy;
            categories.add(modelFamily);
        }
        summary.push(layoutSummary);
    }
    
    // Sort categories (model families) alphabetically
    return { data: summary, categories: Array.from(categories).sort() };
}



//Helper: To shorten labels for X-axis (useful for Overall Accuracy chart to avoid label clutter)
function shortLabel(label) {
    return label.replace("Few-Shot", "FS\n")
              .replace("Zero-Shot", "ZS\n");
}


// --- D3.JS CHART DRAWING FUNCTIONS ---

const tooltip = d3.select("#tooltip");


// Draw the OVERALL ACCURACY bar chart
function drawOverallAccuracyChart(summaryData) {
    const containerId = "#overall-accuracy-chart-container";
    d3.select(containerId).select("svg").remove();

    const margin = { top: 20, right: 10, bottom: 120, left: 80 };
    const width = 520 - margin.left - margin.right;
    const height = 650 - margin.top - margin.bottom;
    
    const svg = d3.select(containerId).append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g").attr("transform", `translate(${margin.left},${margin.top})`);

    const x = d3.scaleBand()
        .domain(summaryData.map(d => `${d.model} ${d.category}`))
        .range([0, width]).padding(0.2);

    const y = d3.scaleLinear().domain([0, 100]).range([height, 0]);


    // Draw X Axis
    svg.append("g")
        .attr("transform", `translate(5, ${height})`)
        .call(d3.axisBottom(x).tickFormat(shortLabel))
        .selectAll("text")
        .attr("transform", "rotate(-25)")
        .style("text-anchor", "end")
        .attr("font-weight", "bold")
        .style("font-size", "0.85rem");
    svg.append("g").call(d3.axisLeft(y));

    // Draw X Axis Label
    svg.append("text")
    .attr("class", "axis-label")
    .attr("text-anchor", "middle")
    .attr("x", width / 2)
    .attr("y", height + 110)
    .text("Configuration");
    
    // Draw Y Axis Label
    svg.append("text").attr("class", "axis-label").attr("text-anchor", "end").attr("y", -margin.left + 20).attr("x", -height / 2 + 50).attr("transform", "rotate(-90)").text("Average Accuracy (%)");

    // Draw Bars
    svg.selectAll(".bar").data(summaryData).join("rect")
        .attr("x", d => x(`${d.model} ${d.category}`)).attr("y", d => y(d.accuracy))
        .attr("width", x.bandwidth()).attr("height", d => height - y(d.accuracy))
        .attr("fill", d => {
            const category = d.category.toLowerCase();
            const cotMode = category.includes('(cot)') ? 'cot' : 'no_cot';
            
            // new logic for colors to match new color scheme
            let llmMode = 'zero_shot'; 
            if (category.includes('few_shot') || category.includes('few-shot')) {
                llmMode = 'few_shot';
            }
            
            return getGlobalColor(d.model, llmMode, cotMode);
        })
        .on("mouseover", () => tooltip.style("visibility", "visible"))
        .on("mousemove", (event, d) => {
            tooltip.html(`<b>${d.model} ${d.category}</b><br>Accuracy: ${d.accuracy.toFixed(2)}%`)
                .style("top", (event.pageY - 10) + "px").style("left", (event.pageX + 10) + "px");
        })
        .on("mouseout", () => tooltip.style("visibility", "hidden"));
}

// NEW: Besides the alphabetical order, layouts can now sorted by their Average Accuracy calculated across all tasks and models for that specific layout.
// Order: From BEST average accuracy (leftmost) to WORST average accuracy (rightmost).
function drawBeeswarmMatrix(containerId, cellData, layoutOrder = 'avg_accuracy') {
    
    // Draw the BEESWARM MATRIX
    d3.select(containerId).select("svg").remove();

    // Define margins and dimensions
    const margin = { top: 40, right: 30, bottom: 60, left: 60 };
    let width = 1600 - margin.left - margin.right;
    const height = 500 - margin.top - margin.bottom;

    // Adjust width if in "bastian" mode
    if (currentMode === "bastian") width = (width / 8) * 10;

    // Create the main SVG canvas
    const svg = d3.select(containerId).append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g").attr("transform", `translate(${margin.left},${margin.top})`);

    // Deconstruct data
    let { tasks, layouts, models, cells } = cellData;

    // --- DYNAMIC COLUMN (LAYOUT) REORDERING LOGIC ---
    if (layoutOrder === 'avg_accuracy') {
        // Calculate the average accuracy across all tasks/models for each layout
        const layoutAvgMap = {};
        layouts.forEach(layout => {
            const vals = [];
            tasks.forEach(t => {
                models.forEach(m => {
                    const arr = (cells[t] && cells[t][layout] && cells[t][layout][m]) || [];
                    arr.forEach(p => vals.push(p.accuracy));
                });
            });
            layoutAvgMap[layout] = vals.length ? d3.mean(vals) : 0;
        });

        // Sort layouts by descending average accuracy (Best to Worst, Left to Right)
        layouts = layouts.slice().sort((a, b) => (layoutAvgMap[b] || 0) - (layoutAvgMap[a] || 0));

    } else if (layoutOrder === 'alphabetical') {
        // Sort layouts alphabetically by their name
        layouts = layouts.slice().sort((a, b) => a.localeCompare(b));
    }
    // --- END DYNAMIC COLUMN REORDERING ---

    // Function to determine point color based on model and ground truth (gt)
    const colorPicker = d => {
        // Define color palettes
        const colorOpenAI = ["#b2dde6", "#90e0ef", "#00b4d8", "#0077b6", "#090ca0"];
        const colorMistral = ["#ffd700", "#ffaf01", "#ff8204", "#fa500f", "#e00500"];
        const colorGemini = ["#fb8cad", "#e75c9d", "#c80d9b", "#bf1a3b", "#910824"];
        const colorGLM = ["#91f79f", "#53efb6", "#37c18e", "#118e60", "#056355"];

        let i = 0; // Color index based on gt or task specific logic
        if (d.test.includes("task1")) {
            i = parseInt(d.gt.replace('gt', ''), 10) - 1;
        } else if (d.test.includes("task2")) {
            if ((currentMode === "aurora" && d.gt === "gt3") || (currentMode === "bastian" && d.gt === "gt2")) i = 4;
        } else if (d.test.includes("task3")) {
            const diff = parseInt(d.gt.replace('gt', ''), 10);
            if (currentMode === "bastian") {
                if (diff === 3) i = 4;
                else if (diff === 2) i = 2;
            } else if (diff === 3) i = 4;
        }

        // Apply color based on model name
        switch (d.rawModelName) {
            case "gpt-5":
            case "gpt-5-2025-08-07":
                return colorOpenAI[i];
            case "mistral-small-3.1-24b":
                return colorMistral[i];
            case "gemini-2.5-flash":
                return colorGemini[i];
            case "glm-4.5v-106b":
                return colorGLM[i];
            default:
                return "#ccc";
        }
    };

    // Layout settings for the matrix
    const cols = layouts.length;
    const rows = tasks.length;
    const cellPadding = 4;
    const cellInnerPadding = 8;

    const cellWidth = width / Math.max(1, cols);
    const cellHeight = height / Math.max(1, rows);

    // Top column labels (layouts) - now in the chosen order
    svg.selectAll(".col-label").data(layouts).join("text")
        .attr("class", "col-label")
        .attr("x", (_, i) => i * cellWidth + cellWidth / 2)
        .attr("y", -10)
        .attr("text-anchor", "middle")
        .style("font-weight", "600")
        .text(d => d);

    // Left row labels (tasks)
    svg.selectAll(".row-label").data(tasks).join("text")
        .attr("class", "row-label")
        .attr("x", -10)
        .attr("y", (_, i) => i * cellHeight + cellHeight / 2)
        .attr("text-anchor", "end")
        .attr("dominant-baseline", "middle")
        .style("font-weight", "600")
        .text(d => d);

    // Create a group for each cell
    const cellGroup = svg.selectAll(".matrix-cell")
        .data(
            // Flatten the task x layout structure into an array of cell objects
            tasks.flatMap((t, r) => layouts.map((l, c) => ({ task: t, layout: l, r, c })))
        )
        .join("g")
        .attr("id", d => `cell-${(d.layout || '').replace(/\s+/g, '_')}-${(d.task || '').replace(/\s+/g, '_')}`)
        .attr("class", "matrix-cell")
        .attr("transform", d => `translate(${d.c * cellWidth}, ${d.r * cellHeight})`);

    // Draw cell backgrounds / borders
    cellGroup.append("rect")
        .attr("x", 0).attr("y", 0)
        .attr("width", cellWidth).attr("height", cellHeight)
        .attr("fill", "transparent");


    // draw internal grid lines between cells, but not on the outer edges of the matrix
    cellGroup.each(function (cellInfo) {
        // TODO: renable/remove early return, for border between cells
        return;

        const g = d3.select(this);

        // Draw horizontal line (except for the last row)
        if (cellInfo.r < tasks.length - 1) {
        g.append("line")
            .attr("x1", 0)
            .attr("x2", cellWidth)
            .attr("y1", cellHeight)
            .attr("y2", cellHeight)
            .attr("stroke", "#ccc")
            .attr("stroke-width", 0.5);
        }

        // Draw vertical line (except for the last column)
        if (cellInfo.c < layouts.length - 1) {
        g.append("line")
            .attr("x1", cellWidth)
            .attr("x2", cellWidth)
            .attr("y1", 0)
            .attr("y2", cellHeight)
            .attr("stroke", "#ccc")
            .attr("stroke-width", 0.5);
        }
    });

    // For each cell, plot beeswarms for all models
    cellGroup.each(function (cellInfo) {
        const g = d3.select(this);

        const innerX = cellPadding;
        const innerY = cellPadding;
        const innerW = cellWidth - cellPadding * 2;
        const innerH = cellHeight - cellPadding * 2;

        // Y-scale for accuracy (0-100)
        const yScale = d3.scaleLinear().domain([0, 100]).range([innerH - cellInnerPadding, cellInnerPadding]);

        // Add a style tag to hide the cell Y-axis, only showing it for the first cell
        if (!document.getElementById('hide-cell-y-axis-style')) {
            d3.select("head").append("style")
                .attr("id", "hide-cell-y-axis-style")
                .text(".cell-y-axis { display: none !important; }");
        }

        // =================================================================
        // --- DYNAMIC MODEL REORDERING (INSIDE CELL) LOGIC ---
        // Now the order of models within each cell can also be dynamic based on layoutOrder
        
        let modelsOrder; 

        if (layoutOrder === 'avg_accuracy') {
            // If average accuracy, compute per-model means for this cell
            const perModelMeans = new Map();
            models.forEach(m => {
                const arr = (cells[cellInfo.task] && cells[cellInfo.task][cellInfo.layout] && cells[cellInfo.task][cellInfo.layout][m]) || [];
                perModelMeans.set(m, arr.length ? d3.mean(arr, d => d.accuracy) : -Infinity);
            });
            // avg_accuracy: sort models by descending mean accuracy
            modelsOrder = models.slice().sort((a, b) => (perModelMeans.get(b) || 0) - (perModelMeans.get(a) || 0));
        
        } else { // 'alphabetical'
            // If alphabetical, keep original order
            modelsOrder = models.slice(); 
        }

        // Local X slot function that uses this cell's model ordering
        const slotXLocal = i => innerX + (i + 0.5) * (innerW / Math.max(1, modelsOrder.length)) + 6;
        //
        // --- END OF NEW PART ---
        // =================================================================


        // Collect points for this cell using modelsOrder
        const pts = [];
        modelsOrder.forEach((m, mi) => {
            const arr = (cells[cellInfo.task] && cells[cellInfo.task][cellInfo.layout] && cells[cellInfo.task][cellInfo.layout][m]) || [];
            arr.forEach(d => {
                pts.push(Object.assign({}, d, {
                    modelKey: m,
                    modelIndex: mi,
                    targetX: slotXLocal(mi), // Final X position before collision detection
                    targetY: innerY + yScale(d.accuracy), // Final Y position
                    r: 3.5 // Radius for force simulation
                }));
            });
        });

        // Handle case with no data
        if (pts.length === 0) {
            g.append("text")
                .attr("x", innerX + innerW / 2)
                .attr("y", innerY + innerH / 2)
                .attr("text-anchor", "middle")
                .attr("dominant-baseline", "middle")
                .attr("fill", "#999")
                .style("font-size", "10px")
                .text("no data");
            return;
        }

        // Run D3 force simulation for beeswarm effect
        const sim = d3.forceSimulation(pts)
            .force("x", d3.forceX(d => d.targetX).strength(1)) // Stick to target X slot
            .force("y", d3.forceY(d => d.targetY).strength(1)) // Stick to target Y accuracy
            .force("collide", d3.forceCollide(d => d.r + 0.5)) // Prevent overlap
            .stop();

        // Run simulation for fixed number of ticks (80 is typical for quick convergence)
        for (let i = 0; i < 80; ++i) sim.tick();

        /* constrain simulation results inside the inner plotting area */
        // for (const p of pts) {
            // p.x = Math.max(innerX + p.r, Math.min(innerX + innerW - p.r, p.x));
            // p.y = Math.max(innerY + cellInnerPadding + p.r, Math.min(innerY + innerH - cellInnerPadding - p.r, p.y));
        // }


        // Draw accuracy threshold lines
        const thresholds = [25, 50, 75];
        g.selectAll(".threshold-line").data(thresholds).join("line")
            .attr("class", "threshold-line")
            .attr("x1", innerX).attr("x2", innerX + innerW)
            .attr("y1", d => innerY + yScale(d)).attr("y2", d => innerY + yScale(d))
            .attr("stroke", "#bbbbbb").attr("stroke-width", 1).attr("stroke-dasharray", "4 4").attr("opacity", 0.55);

        // Add threshold labels (only on the rightmost column)
        if (cellInfo.c === layouts.length - 1) {
            g.selectAll(".threshold-label").data(thresholds).join("text")
                .attr("class", "threshold-label")
                .attr("x", innerX + innerW + 6)
                .attr("y", d => innerY + yScale(d))
                .attr("text-anchor", "start")
                .attr("dominant-baseline", "middle")
                .attr("fill", "#444")
                .style("font-size", "10px")
                .text(d => d + "%");
        }

        // Draw points (circles)
        const points = g.append("g").attr("class", "points")
            .selectAll("circle").data(pts).join("circle")
            .attr("cx", d => d.x).attr("cy", d => d.y).attr("r", d => d.r)
            .attr("fill", d => colorPicker(d))
            // Add tooltip handlers (assuming 'tooltip' element is defined elsewhere)
            .on("mouseover", () => tooltip.style("visibility", "visible"))
            .on("mousemove", (event, d) => {
                tooltip.html(`<b>${d.rawModelName}</b><br>${d.llmMode} / ${d.cotMode}<br>Accuracy: ${d.accuracy.toFixed(1)}%<br>Count: ${d.count}<br>${d.test}`)
                    .style("top", (event.pageY - 10) + "px").style("left", (event.pageX + 10) + "px");
            })
            .on("mouseout", () => tooltip.style("visibility", "hidden"));

        // Draw mean lines per-model
        const means = d3.rollup(pts, v => d3.mean(v, d => d.accuracy), d => d.modelKey);
        const meanGroup = g.append("g").attr("class", "means");
        Array.from(means.entries()).forEach(([m, meanVal]) => {
            const mi = modelsOrder.indexOf(m); // Use model's index in the local order
            const xCenter = slotXLocal(mi);
            const yPos = innerY + yScale(meanVal);
            const lineW = Math.min(innerW / models.length * 0.7, 40);
            meanGroup.append("line")
                .attr("x1", xCenter - lineW / 2).attr("x2", xCenter + lineW / 2)
                .attr("y1", yPos).attr("y2", yPos)
                .attr("stroke", "#333").attr("stroke-width", 3).attr("stroke-dasharray", "3 6").style("stroke-linecap", "round");
        });

        // Add model labels (only on the bottom row)
        if (cellInfo.r === tasks.length - 1) {
            const labelGroup = g.append("g").attr("class", "cell-model-labels");
            modelsOrder.forEach((m, mi) => {
                labelGroup.append("text")
                    .attr("x", slotXLocal(mi))
                    .attr("y", innerY + innerH + 20)
                    .attr("text-anchor", "middle")
                    .attr("dominant-baseline", "alphabetic")
                    .style("font-size", "11px")
                    .style("fill", "#444")
                    .text(m.replace(/.*?(gemini|mistral|gpt-5|glm).*/i, s => {
                        if (/mistral/i.test(s)) return "Mistral";
                        if (/gemini/i.test(s)) return "Gemini";
                        if (/gpt-5/i.test(s)) return "gpt-5";
                        if (/glm/i.test(s)) return "GLM4.5";
                        return s;
                    }));
            });
        }

        // Add Y-axis to the left of the first column of cells (first row only)
        if (cellInfo.c === 0 && cellInfo.r === 0) {
            const axisG = g.append("g")
                .attr("class", "cell-y-axis")
                .attr("transform", `translate(${innerX}, ${innerY})`)
                .call(d3.axisLeft(yScale).ticks(3).tickSizeOuter(0));
            // Add Y-axis label to the first row only
            if (cellInfo.r === 0) {
                svg.append("text")
                    .attr("class", "axis-label")
                    .attr("text-anchor", "end")
                    .attr("transform", "rotate(-90)")
                    .attr("y", -margin.left + 20)
                    .attr("x", -height / 2 + 50);
            }
        }
    });
}



/* Draws the legend separately outside the main chart SVG.*/
function drawGroupedBarChartLegend(containerId, categories, getColorMap) {
    d3.select(containerId).select("svg").remove();

    const colorMap = getColorMap(categories);
    const fallbackColor = d3.scaleOrdinal(d3.schemeTableau10);
    const legendWidth = 300; 
    const legendHeight = categories.length * 25;

    const svg = d3.select(containerId).append("svg")
        .attr("width", legendWidth)
        .attr("height", legendHeight)
        .append("g").attr("transform", `translate(10, 10)`);
    
    // Legend 
    const legend = svg.selectAll(".legend").data(categories).join("g")
        .attr("class", "legend")
        .attr("transform", (d, i) => `translate(0,${i * 22})`);
        
    legend.append("rect")
        .attr("x", 0)
        .attr("y", 0)
        .attr("width", 18)
        .attr("height", 18)
        .style("fill", d => colorMap[d] || fallbackColor(d));

    legend.append("text")
        .attr("x", 24)
        .attr("y", 9)
        .attr("dy", ".35em")
        .style("text-anchor", "start")
        .text(d => d);
}

// Draw a GROUPED BAR CHART (both for Tasks or Layouts)
// MODIFIED to accept an optional model name for correct color mapping in model-specific charts
function drawGroupedBarChart(containerId, chartData, groupKey, modelNameForColoring = null) {
    d3.select(containerId).select("svg").remove();
    const { data, categories } = chartData;

    // N.B. MARGINS AND DIMENSIONS for the PLOTTING AREA (this time is independent from legend)
    const margin = { top: 40, right: 40, bottom: 60, left: 60 }; 
    const chartTotalWidth = 550; 
    const width = chartTotalWidth - margin.left - margin.right; 
    const height = 750 - margin.top - margin.bottom; 


    const svg = d3.select(containerId).append("svg")
        .attr("width", width + margin.left + margin.right) 
        .attr("height", height + margin.top + margin.bottom)
        .append("g").attr("transform", `translate(${margin.left},${margin.top})`);
    
    // --- COLOUR MAP (needed for the legend if we keep it) ---
    
    const getColorMap = (categories) => {
        const colorMap = {};
        categories.forEach(category => {
            const key = category.toLowerCase();
            
            // Use the passed-in model name for specific charts, or parse it from the category for the combined chart
            let modelName = modelNameForColoring; 
            if (!modelName) {
                if (key.startsWith('mistral')) modelName = 'mistral';
                else if (key.startsWith('gemini')) modelName = 'gemini';
                else if (key.startsWith('gpt-5')) modelName = 'gpt-5';
                else if (key.startsWith('glm')) modelName = 'glm';
                else modelName = 'unknown';
            }

            // --- NEW PART STARTS HERE ---
            let llmMode = 'zero_shot';
            let cotMode = 'no_cot';

            // Check if it's a detailed config or an aggregated model name
            if (key.includes('(')) { 
                // It's a detailed config like "zero_shot (cot)"
                cotMode = key.includes('(cot)') ? 'cot' : 'no_cot';
                if (key.includes('few_shot') || key.includes('few-shot')) {
                    llmMode = 'few_shot';
                }
            } else {
                // It's an aggregated key like "Mistral" or "GPT-5".
                // Let's use a "base" color, e.g., few_shot no_cot (index 2)
                llmMode = 'few_shot'; 
                cotMode = 'no_cot';
            }
            // --- END NEW PART ---
            
            colorMap[category] = getGlobalColor(modelName, llmMode, cotMode);
        });
        return colorMap;
    }

    const colorMap = getColorMap(categories);
    const fallbackColor = d3.scaleOrdinal(d3.schemeTableau10);

    const x0 = d3.scaleBand().domain(data.map(d => d[groupKey])).range([0, width]).padding(0.25);
    const x1 = d3.scaleBand().domain(categories).range([0, x0.bandwidth()]).padding(0.05);
    const y = d3.scaleLinear().domain([0, 100]).range([height, 0]);
    
    svg.append("g").attr("transform", `translate(0, ${height})`).call(d3.axisBottom(x0))
        .selectAll("text").attr("transform", "translate(-10,0)rotate(-45)").style("text-anchor", "end");
    svg.append("g").call(d3.axisLeft(y));
    svg.append("text").attr("class", "axis-label").attr("text-anchor", "end").attr("y", -margin.left + 20).attr("x", -height / 2 + 50).attr("transform", "rotate(-90)").text("Average Accuracy (%)");

    const group = svg.selectAll(".group").data(data).join("g")
        .attr("class", "group")
        .attr("transform", d => `translate(${x0(d[groupKey])},0)`);

    group.selectAll("rect").data(d => categories.map(key => ({ key, value: d[key] || 0 })))
        .join("rect")
        .attr("x", d => x1(d.key))
        .attr("y", d => y(d.value))
        .attr("width", x1.bandwidth())
        .attr("height", d => height - y(d.value))
        .attr("fill", d => colorMap[d.key] || fallbackColor(d.key))
        .on("mouseover", () => tooltip.style("visibility", "visible"))
        .on("mousemove", (event, d) => {
            tooltip.html(`<b>${d.key}</b><br>Accuracy: ${d.value.toFixed(2)}%`)
                .style("top", (event.pageY - 10) + "px").style("left", (event.pageX + 10) + "px");
        })
        .on("mouseout", () => tooltip.style("visibility", "hidden"));
        
    return { categories, getColorMap };
}


// --- MAIN RENDER FUNCTION ---
async function renderDashboard() {
    document.getElementById('charts-container').innerHTML = '<h2>Loading and processing results...</h2>';
    
    document.getElementById('btn-aurora').classList.toggle('active', currentMode === 'aurora');
    document.getElementById('btn-bastian').classList.toggle('active', currentMode === 'bastian');

    //Load human results 
    let human_results_bastian = { "errors": {"b-": 0.53, "b+": 0.24, "c-": 0.80, "c+": 0.29, "m-": 0.38, "m+": 0.36, "o-": 0.36, "o+": 0.36, "s-": 0.31, "s+": 0.29} };
    let human_results_aurora = { "errors": {"FD-FR": 0.164, "FD-K": 0.109, "PG": 0.291, "PGS": 0.236, "POGBa": 0.236, "POGBb": 0.255, "SEIS": 0.436, "Tu": 0.145} };
    let human_results = (currentMode === 'bastian') ? human_results_bastian : human_results_aurora;
    let path = (currentMode === 'bastian') ? '../aesthetic_effect_human_performance' : '../layout_algorithms_performance';

    const rawData = await loadAndAggregateResults(path, currentMode);
    
    if (rawData.length === 0) {
        document.getElementById('charts-container').innerHTML = `<h1>No result files found for the ${currentMode} dataset.</h1>`;
        return;
    }

    // Process data for all charts
    const overallSummary = processDataForOverallChart(rawData, human_results);
    const taskSummary = processDataForTaskChart(rawData);
    let layoutSummary = processDataForLayoutChart(rawData);
    const matrixData = processDataForMatrix(rawData);
    const modelSpecificLayoutData = processDataForLayoutChartByModel(rawData); // NEW: Data for specific charts

    let layoutSummaryByFamily = processDataForLayoutChartByModelFamily(rawData);

    // Re-order layout data for "bastian mode"
    if (currentMode === 'bastian') {
        layoutSummary = reorderLayoutData(layoutSummary);
        layoutSummaryByFamily = reorderLayoutData(layoutSummaryByFamily);
    }

    // Render the page structure with containers for all charts
    document.getElementById('charts-container').innerHTML = `

        <div class="chart-wrapper">
            <h2 class="chart-title">Matrix</h2>
            <div id="beeswarm-matrix"></div>
            <div class="controls order-controls matrix-order-control">
                <h3>Order Layouts by:</h3>
                <select id="layout-order-select">
                    <option value="alphabetical" ${layoutOrder === 'alphabetical' ? 'selected' : ''}>Alphabetical</option>
                    <option value="avg_accuracy" ${layoutOrder === 'avg_accuracy' ? 'selected' : ''}>Average Accuracy (Best Left)</option>
                </select>
            </div>
        </div>
        
        <div class="chart-wrapper">
            <h2 class="chart-title">Overall Accuracy by Configuration</h2>
            <div id="overall-accuracy-chart-container"></div>
        </div>

        <div class="chart-and-legend-wrapper">
            <div class="chart-container-inner">
                <h2 class="chart-title">Accuracy by Task</h2>
                <div id="task-accuracy-chart-container"></div>
            </div>
            <div class="legend-container">
                <h3>Configuration Legend</h3>
                <div id="task-legend-container"></div>
            </div>
        </div>



        <div class="chart-and-legend-wrapper">
            <div class="chart-container-inner">
                <h2 class="chart-title">Accuracy by Layout Algorithm</h2>
                <div id="layout-accuracy-chart-container"></div>
            </div>
            <div class="legend-container">
                <h3>Configuration Legend</h3>
                <div id="layout-legend-container"></div>
            </div>
        </div>

        <div class="chart-and-legend-wrapper">
            <div class="chart-container-inner">
                <h2 class="chart-title">Accuracy by Layout (Aggregated by Model)</h2>
                <div id="layout-accuracy-family-chart-container"></div>
            </div>
            <div class="legend-container">
                <h3>Model Legend</h3>
                <div id="layout-family-legend-container"></div>
            </div>
        </div>
        <div id="model-specific-charts-container">
        </div>

        <div id="model-specific-charts-container"></div>
        `;

    // Draw each all charts
    drawOverallAccuracyChart(overallSummary);
    drawBeeswarmMatrix("#beeswarm-matrix", matrixData, layoutOrder);
    
    // Draw Task chart and get legend data
    const taskLegendData = drawGroupedBarChart("#task-accuracy-chart-container", taskSummary, "task");
    drawGroupedBarChartLegend("#task-legend-container", taskLegendData.categories, taskLegendData.getColorMap);

    // Draw Layout chart and get legend data
    const layoutLegendData = drawGroupedBarChart("#layout-accuracy-chart-container", layoutSummary, "layout");
    drawGroupedBarChartLegend("#layout-legend-container", layoutLegendData.categories, layoutLegendData.getColorMap);

    // Draw the model-specific layout charts 
    const modelChartsContainer = document.getElementById('model-specific-charts-container');
    const modelNames = Object.keys(modelSpecificLayoutData).sort(); // Sort for consistent order

    // NEW: Draw Layout by Model Family chart and legend
    const layoutFamilyLegendData = drawGroupedBarChart("#layout-accuracy-family-chart-container", layoutSummaryByFamily, "layout");
    drawGroupedBarChartLegend("#layout-family-legend-container", layoutFamilyLegendData.categories, layoutFamilyLegendData.getColorMap);


    for (const modelName of modelNames) {
        const chartData = modelSpecificLayoutData[modelName];

        // Create wrapper for this model's chart
        const chartWrapper = document.createElement('div');
        chartWrapper.className = 'chart-and-legend-wrapper';
        
        const chartId = `layout-accuracy-chart-${modelName.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
        const legendId = `layout-legend-${modelName.toLowerCase().replace(/[^a-z0-9]/g, '')}`;

        chartWrapper.innerHTML = `
            <div class="chart-container-inner">
                <h2 class="chart-title">Accuracy by Layout for ${modelName}</h2>
                <div id="${chartId}"></div>
            </div>
            <div class="legend-container">
                <h3>Configuration Legend</h3>
                <div id="${legendId}"></div>
            </div>
        `;
        modelChartsContainer.appendChild(chartWrapper);

        // Re-order if bastian mode
        let finalChartData = chartData;
        if (currentMode === 'bastian') {
            finalChartData = reorderLayoutData(chartData);
        }

        // Draw the chart and legend, passing the modelName for correct coloring
        const legendData = drawGroupedBarChart(`#${chartId}`, finalChartData, "layout", modelName);
        drawGroupedBarChartLegend(`#${legendId}`, legendData.categories, legendData.getColorMap);
    }
}

// --- Event Listeners ---
document.getElementById('btn-aurora').addEventListener('click', () => { currentMode = 'aurora'; renderDashboard(); });
document.getElementById('btn-bastian').addEventListener('click', () => { currentMode = 'bastian'; renderDashboard(); });

document.addEventListener('change', (event) => {
    if (event.target.id === 'layout-order-select') {
        layoutOrder = event.target.value;
        renderDashboard(); // Re-render the dashboard with the new order
    }
});


// Initial load
renderDashboard();

</script>
