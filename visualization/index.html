<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal HTML Template</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
            background: #fafbfc;
            color: #222;
        }
        main {
            max-width: 600px;
            margin: auto;
        }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
</body>
<script>

let mode = "aurora"
// let mode = "bastian"

let human_results_bastian = {
    "errors": {
        "b-": 0.53,
        "b+": 0.24,
        "c-": 0.80,
        "c+": 0.29,
        "m-": 0.38,
        "m+": 0.36,
        "o-": 0.36,
        "o+": 0.36,
        "s-": 0.31,
        "s+": 0.29
    },
    "reaction_time": {
        "b-": 81.40,
        "b+": 67.18,
        "c-": 139.78,
        "c+": 66.39,
        "m-": 68.17,
        "m+": 76.55,
        "o-": 76.71,
        "o+": 68.17,
        "s-": 67.74,
        "s+": 55.58
    }
}

let human_results_aurora = {
    "errors": {
        "FD-FR": 0.164,
        "FD-K": 0.109,
        "PG": 0.291,
        "PGS": 0.236,
        "POGBa": 0.236,
        "POGBb": 0.255,
        "SEIS": 0.436,
        "Tu": 0.145
    },
    "reaction_time": {
        "FD-FR": 66.79,
        "FD-K": 68.54,
        "PG": 73.23,
        "PGS": 78.41,
        "POGBa": 77.55,
        "POGBb": 74.76,
        "SEIS": 78.67,
        "Tu": 77.74
    }
}

async function init(){
    let letters, path, human_results;

    if (mode == "bastian") {
        letters = ["b-", "b+", "c-", "c+", "m-", "m+", "o-", "o+", "s-", "s+"]
        human_results = human_results_bastian;
    } else {
        letters = ["FD-FR", "FD-K", "PG", "PGS", "POGBa", "POGBb", "SEIS", "Tu"]
        human_results = human_results_aurora;
    }
    
    let task_names = ["task1", "task2", "task3"]
    let gts = ["gt1", "gt2", "gt3", "gt4", "gt5"]
    let PAIRS = ["PAIR1", "PAIR2", "PAIR3", "PAIR4", "PAIR5"]; 
    let test_names = [];
    let agglomerated_test_names = [];

    if (mode == "bastian") path = "../aesthetic_effect_human_performance"
    else path = "../layout_algorithms_performance"

    let resultfile = await d3.csv(path + "/results_with_old_prompt.csv")

    for (let task of task_names) {
        for (let letter of letters) {
            agglomerated_test_names.push(`${letter}_${task}`);
        }
    }

    for (let task of task_names) {
        for (let gt of gts) {
            for (let pair of PAIRS) {
                    for (let letter of letters) {
                    test_names.push(`${letter}_${task}_${gt}_${pair}.png`);
                }
            }
        }
    }

    console.log(agglomerated_test_names);

    for (let test of agglomerated_test_names){

        document.body.appendChild(document.createElement("hr"));

        let testdatadiv = document.createElement("div");
        testdatadiv.innerHTML = `<h3>${test}</h3>`;
        testdatadiv.style.fontSize = "1.2rem";
        testdatadiv.style.fontWeight = "bold";
        document.body.appendChild(testdatadiv);

        let testdatadivinfo = document.createElement("div");

        let test_agglomerated_results = resultfile.filter(d => d.Layout.includes(test));
        console.log(test_agglomerated_results);
        let accuracy = test_agglomerated_results.map(d => d["Correct Prediction (True/False)"] == "True").filter(d => d == true).length / test_agglomerated_results.length * 100;
        accuracy = accuracy.toFixed(2);

        testdatadivinfo.innerHTML = `${test_agglomerated_results[0]["Task"]}<br>`;
        testdatadivinfo.innerHTML += `Overall accuracy: ${accuracy}%.`;
        testdatadivinfo.style.fontSize = "0.8rem";
        testdatadivinfo.style.color = "#555";
        document.body.appendChild(testdatadivinfo);

        let testdatadivhuman = document.createElement("div");
        testdatadivhuman.innerHTML = `Human performance: ${(100 - human_results["errors"][test.split("_")[0]]*100).toFixed(2)}% accuracy, ${human_results["reaction_time"][test.split("_")[0]].toFixed(2)} ms reaction time.`;
        testdatadivhuman.style.fontSize = "0.8rem";
        testdatadivhuman.style.color = "#555";
        document.body.appendChild(testdatadivhuman);

        let div = document.createElement("div");

        div.style.display = "flex";
        document.body.appendChild(div);
        for (let gt of gts) {

            if (!resultfile.find(d => d.Layout.includes(test + "_" + gt))) continue;

            let gtcontainer = document.createElement("div");
            gtcontainer.style.border = "1px solid #ccc";
            gtcontainer.style.padding = "1rem";
            // gtcontainer.style.display = "flex";
            gtcontainer.style.marginRight = "1rem";
            gtcontainer.style.marginTop = "1rem";            
            div.appendChild(gtcontainer);

            let aggregated_accuracy_by_gt = resultfile.filter(d => d.Layout.includes(test + "_" + gt))
                .map(d => d["Correct Prediction (True/False)"] == "True")
                .filter(d => d == true).length / resultfile.filter(d => d.Layout.includes(test + "_" + gt)).length * 100;

            let gtheader = document.createElement("div");
            gtheader.style.fontSize = "0.7rem";
            gtheader.innerHTML = "Accuracy for " + gt + ": " + aggregated_accuracy_by_gt.toFixed(2) + "%";
            gtcontainer.appendChild(gtheader);

            let gtdiv = document.createElement("div");
            gtdiv.style.display = "flex";
            gtcontainer.appendChild(gtdiv);

            for (let pair of PAIRS) {
                if (!resultfile.find(d => d.Layout === test + "_" + gt + "_" + pair)) continue;
                try {
                    let instance_results = resultfile.filter(d => d.Layout === test + "_" + gt + "_" + pair);
                    let small_div = document.createElement("div");
                    small_div.style.verticalAlign = "top";
                    small_div.style.marginRight = "1rem";
                    gtdiv.appendChild(small_div);

                    let img = document.createElement("img");
                    img.src = path + "/dataset/test/" + test + "_" + gt + "_" + pair + ".png";
                    img.style.width = "100%";
                    img.style.height = "auto";
                    img.style.marginBottom = "1rem";
                    small_div.appendChild(img);

                    let smaller_div = document.createElement("div");
                    smaller_div.innerHTML = `<b>${gt}_${pair}</b><br>`;

                    // Dividing results into Zero Shot and Few Shot
                    let zero_shot_results = instance_results.filter(result => 
                        result["LLM Mode"]?.toLowerCase().replace("-", "_") === "zero_shot"
                    );
                    let few_shot_results = instance_results.filter(result => 
                        result["LLM Mode"]?.toLowerCase().replace("-", "_") === "few_shot"
                    );

                    // Zero Shot
                    if (zero_shot_results.length > 0) {
                        smaller_div.innerHTML += `<span style="color:#1a73e8;"><b>Zero Shot</b></span><br>`;
                        zero_shot_results.forEach((result, idx) => {
                            smaller_div.innerHTML += `${idx}: ${result["Correct Prediction (True/False)"]}<br>`;
                        });
                    }

                    // Few Shot
                    if (few_shot_results.length > 0) {
                        smaller_div.innerHTML += `<span style="color:#e8711a;"><b>Few Shot</b></span><br>`;
                        few_shot_results.forEach((result, idx) => {
                            smaller_div.innerHTML += `${idx}: ${result["Correct Prediction (True/False)"]}<br>`;
                        });
                    }

                    smaller_div.style.fontSize = "0.65rem";
                    small_div.appendChild(smaller_div);


                } catch (error) {
                    console.error(`Error processing ${test}_${gt}_${pair}:`, error);
                }
            }
        }
        // let img = document.createElement("img");
        // img.src = path + "/dataset/test/" + test + "_gt2_PAIR1" + ".png";
        // img.style.width = "50%";
        // img.style.height = "auto";
        // img.style.marginBottom = "1rem";
        // div.appendChild(img);

        // find in resultfile the entry that has "layout" named like test
        // d3.csv(resultfile).then(data => {
        //     let entry = data.filter(d => d.Layout === test + "_gt2_PAIR1"); // Match the full name including .png
        //     console.log(entry)
        // });
    }
}

init();
    
</script>
</html>
