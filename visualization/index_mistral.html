<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualize LLM Results</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
            background: #fafbfc;
            color: #222;
        }
        .controls-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #eee;
        }
        .controls {
            text-align: center;
        }
        .controls h3 {
            margin-top: 0;
            color: #555;
        }
        .controls button {
            padding: 10px 20px;
            font-size: 1rem;
            margin: 0 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 5px;
            transition: background-color 0.2s, color 0.2s;
        }
        /* Model Buttons Colors */
        .model-controls button.active {
            background: #1a73e8; /* Blue */
            color: white;
            border-color: #1a73e8;
        }
        .model-controls button:not(.active) {
            background: #80868b; /* Gray */
            color: white;
            border-color: #80868b;
        }
        /* Mode Buttons Colors (Dataset) */
        .mode-controls button.active {
            background: #e8711a; /* Orange */
            color: white;
            border-color: #e8711a;
        }
        .mode-controls button:not(.active) {
            background: #80868b; /* Gray */
            color: white;
            border-color: #80868b;
        }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <h1>Visualize LLM Results</h1>
    <p>Select a dataset and a model below. Results are aggregated from all available CSV files for the chosen configuration.</p>

    <div class="controls-container">
        <div class="controls mode-controls">
            <h3>Select Dataset</h3>
            <button id="btn-aurora">Aurora</button>
            <button id="btn-bastian">Bastian</button>
        </div>
        <div class="controls model-controls">
            <h3>Select Model</h3>
            <button id="btn-mistral">Mistral</button>
            <button id="btn-gemini">Gemini</button>
        </div>
    </div>

    <div id="results-container"></div>

</body>
<script>
// ===================================================================================
// SCRIPT REFACTORED FOR INDEPENDENT CONTROLS
// ===================================================================================

let currentModel = 'mistral-small-3.1-24b';
let currentMode = 'aurora';

// MODIFIED: loadAndAggregateResults function is now more flexible.
async function loadAndAggregateResults(basePath, modelName, mode) {
    let allFilePaths = [];

    // CHANGED: Unified logic for both Mistral and Gemini.
    // This block now handles any model that uses the subfolder structure.
    if (modelName === "gemini" || modelName === "mistral-small-3.1-24b") {
        console.log(`Loading results for ${modelName} with the new folder structure...`);
        
        const shotTypes = ["zero_shot", "few_shot"];
        const cotTypes = ["cot", "no_cot"];
        
        // NEW: Dynamic attempts.
        // Instead of a fixed array, we will try to load files up to a maximum number.
        // If a file doesn't exist, the .catch() block will handle it gracefully.
        // You can increase this number if you ever have more than 50 attempts.
        const MAX_ATTEMPTS_TO_CHECK = 50;

        for (const shot of shotTypes) {
            for (const cot of cotTypes) {
                // CHANGED: Loop from 1 to MAX_ATTEMPTS_TO_CHECK instead of using a fixed array.
                for (let attempt = 1; attempt <= MAX_ATTEMPTS_TO_CHECK; attempt++) {
                    const fileName = `results_attempt_${attempt}.csv`;
                    const basePathForModel = (mode === 'bastian') ? '../aesthetic_effect_human_performance' : '../layout_algorithms_performance';
                    const filePath = `${basePathForModel}/results/${modelName}/${shot}/${cot}/${fileName}`;
                    allFilePaths.push(filePath);
                }
            }
        }
    }

    const promises = allFilePaths.map(path =>
        d3.csv(path)
            .then(rows => {
                rows.forEach(row => { row.File_Path = path; });
                return rows;
            })
            .catch(error => {
                // This .catch() is now essential. It ignores requests for files that don't exist.
                // You will see warnings in the console for non-existent attempts, which is normal.
                // console.warn(`Could not load file (optional): ${path}`);
                return [];
            })
    );

    const resultsFromAllFiles = await Promise.all(promises);
    return resultsFromAllFiles.flat();
}

// The renderResults function remains mostly the same, as the logic inside is already robust.
async function renderResults() {
    const resultsContainer = document.getElementById('results-container');
    resultsContainer.innerHTML = '<h2>Loading results...</h2>';

    document.getElementById('btn-mistral').classList.toggle('active', currentModel === 'mistral-small-3.1-24b');
    document.getElementById('btn-gemini').classList.toggle('active', currentModel === 'gemini');
    document.getElementById('btn-aurora').classList.toggle('active', currentMode === 'aurora');
    document.getElementById('btn-bastian').classList.toggle('active', currentMode === 'bastian');

    let human_results_bastian = {
        "errors": {"b-": 0.53, "b+": 0.24, "c-": 0.80, "c+": 0.29, "m-": 0.38, "m+": 0.36, "o-": 0.36, "o+": 0.36, "s-": 0.31, "s+": 0.29},
        "reaction_time": {"b-": 81.40, "b+": 67.18, "c-": 139.78, "c+": 66.39, "m-": 68.17, "m+": 76.55, "o-": 76.71, "o+": 68.17, "s-": 67.74, "s+": 55.58}
    };
    let human_results_aurora = {
        "errors": {"FD-FR": 0.164, "FD-K": 0.109, "PG": 0.291, "PGS": 0.236, "POGBa": 0.236, "POGBb": 0.255, "SEIS": 0.436, "Tu": 0.145},
        "reaction_time": {"FD-FR": 66.79, "FD-K": 68.54, "PG": 73.23, "PGS": 78.41, "POGBa": 77.55, "POGBb": 74.76, "SEIS": 78.67, "Tu": 77.74}
    };

    let letters, path, human_results;
    
    if (currentMode == "bastian") {
        letters = ["b-", "b+", "c-", "c+", "m-", "m+", "o-", "o+", "s-", "s+"];
        path = "../aesthetic_effect_human_performance";
        human_results = human_results_bastian;
    } else { // Aurora mode
        letters = ["FD-FR", "FD-K", "PG", "PGS", "POGBa", "POGBb", "SEIS", "Tu"];
        path = "../layout_algorithms_performance";
        human_results = human_results_aurora;
    }
    
    let resultfile = await loadAndAggregateResults(path, currentModel, currentMode);
    
    resultsContainer.innerHTML = ''; 
    
    if (resultfile.length === 0) {
        resultsContainer.innerHTML = `<h1>No result files found for ${currentModel} in ${currentMode} mode.</h1> <p>Check the console and folder structure.</p>`;
        console.error("No data to display.");
        return;
    }
    
    const titleElement = document.createElement('h2');
    let modelDisplayName = currentModel.includes('mistral') ? 'Mistral' : 'Gemini';
    let modeDisplayName = currentMode.charAt(0).toUpperCase() + currentMode.slice(1); 
    titleElement.textContent = `${modeDisplayName} Dataset Results: ${modelDisplayName}`;
    titleElement.style.textAlign = 'center';
    titleElement.style.marginBottom = '1.5rem';
    resultsContainer.appendChild(titleElement);

    let task_names = ["task1", "task2", "task3"];
    let gts = ["gt1", "gt2", "gt3", "gt4", "gt5"];
    let PAIRS = ["PAIR1", "PAIR2", "PAIR3", "PAIR4", "PAIR5"]; 
    let agglomerated_test_names = [];

    for (let task of task_names) {
        for (let letter of letters) {
            agglomerated_test_names.push(`${letter}_${task}`);
        }
    }
    
    for (let test of agglomerated_test_names){
        let test_agglomerated_results = resultfile.filter(d => d.Layout.includes(test));
        if (test_agglomerated_results.length === 0) continue;

        resultsContainer.appendChild(document.createElement("hr"));
        let testdatadiv = document.createElement("div");
        testdatadiv.innerHTML = `<h3>${test}</h3>`;
        testdatadiv.style.fontSize = "1.2rem";
        testdatadiv.style.fontWeight = "bold";
        resultsContainer.appendChild(testdatadiv);

        let testdatadivinfo = document.createElement("div");
        let accuracy = test_agglomerated_results.map(d => d["Correct Prediction (True/False)"] == "True").filter(d => d).length / test_agglomerated_results.length * 100;
        testdatadivinfo.innerHTML = `${test_agglomerated_results[0]["Task"]}<br>`;
        testdatadivinfo.innerHTML += `Overall accuracy: ${accuracy.toFixed(2)}%.`;
        testdatadivinfo.style.fontSize = "0.8rem";
        testdatadivinfo.style.color = "#555";
        resultsContainer.appendChild(testdatadivinfo);

        let testdatadivhuman = document.createElement("div");
        testdatadivhuman.innerHTML = `Human performance: ${(100 - human_results["errors"][test.split("_")[0]]*100).toFixed(2)}% accuracy, ${human_results["reaction_time"][test.split("_")[0]].toFixed(2)} ms reaction time.`;
        testdatadivhuman.style.fontSize = "0.8rem";
        testdatadivhuman.style.color = "#555";
        resultsContainer.appendChild(testdatadivhuman);

        let div = document.createElement("div");
        div.style.display = "flex";
        div.style.flexWrap = "wrap";
        resultsContainer.appendChild(div);

        for (let gt of gts) {
            let results_for_gt = test_agglomerated_results.filter(d => d.Layout.includes(test + "_" + gt));
            if (results_for_gt.length === 0) continue;

            let gtcontainer = document.createElement("div");
            gtcontainer.style.border = "1px solid #ccc";
            gtcontainer.style.padding = "1rem";
            gtcontainer.style.marginRight = "1rem";
            gtcontainer.style.marginTop = "1rem";            
            div.appendChild(gtcontainer);

            let aggregated_accuracy_by_gt = results_for_gt.map(d => d["Correct Prediction (True/False)"] == "True").filter(d => d).length / results_for_gt.length * 100;
            let gtheader = document.createElement("div");
            gtheader.style.fontSize = "0.7rem";
            gtheader.innerHTML = "Accuracy for " + gt + ": " + aggregated_accuracy_by_gt.toFixed(2) + "%";
            gtcontainer.appendChild(gtheader);

            let gtdiv = document.createElement("div");
            gtdiv.style.display = "flex";
            gtcontainer.appendChild(gtdiv);

            for (let pair of PAIRS) {
                const layoutName = `${test}_${gt}_${pair}`;
                let instance_results = test_agglomerated_results.filter(d => d.Layout === layoutName);
                if (instance_results.length === 0) continue;
                try {
                    let small_div = document.createElement("div");
                    small_div.style.verticalAlign = "top";
                    small_div.style.marginRight = "1rem";
                    gtdiv.appendChild(small_div);
                    let img = document.createElement("img");
                    img.src = `${path}/dataset/test/${layoutName}.png`;
                    img.style.width = "100px";
                    img.style.height = "auto";
                    img.style.marginBottom = "1rem";
                    small_div.appendChild(img);
                    let smaller_div = document.createElement("div");
                    smaller_div.innerHTML = `<b>${gt}_${pair}</b><br>`;
                    
                    let zero_shot_results = instance_results.filter(result => result["LLM Mode"] && result["LLM Mode"].trim() === 'Zero-Shot');
                    let few_shot_results = instance_results.filter(result => result["LLM Mode"] && result["LLM Mode"].trim() === 'Few-Shot');
                    
                    if (zero_shot_results.length > 0) {
                        smaller_div.innerHTML += `<span style="color:#1a73e8;"><b>Zero Shot</b></span><br>`;
                        zero_shot_results.forEach((result, idx) => {
                            smaller_div.innerHTML += `${idx}: ${result["Correct Prediction (True/False)"]}<br>`;
                        });
                    }
                    if (few_shot_results.length > 0) {
                        smaller_div.innerHTML += `<span style="color:#e8711a;"><b>Few Shot</b></span><br>`;
                        few_shot_results.forEach((result, idx) => {
                            smaller_div.innerHTML += `${idx}: ${result["Correct Prediction (True/False)"]}<br>`;
                        });
                    }
                    smaller_div.style.fontSize = "0.65rem";
                    small_div.appendChild(smaller_div);
                } catch (error) {
                    console.error(`Error during the processing of ${layoutName}:`, error);
                }
            }
        }
    }
}

document.getElementById('btn-mistral').addEventListener('click', () => {
    currentModel = 'mistral-small-3.1-24b';
    renderResults();
});
document.getElementById('btn-gemini').addEventListener('click', () => {
    currentModel = 'gemini';
    renderResults();
});
document.getElementById('btn-aurora').addEventListener('click', () => {
    currentMode = 'aurora';
    renderResults();
});
document.getElementById('btn-bastian').addEventListener('click', () => {
    currentMode = 'bastian';
    renderResults();
});

renderResults();
    
</script>
</html>
